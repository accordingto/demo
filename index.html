<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading Club Article Generator</title>
<style>
  :root { color-scheme:dark; --bg:#14171c; --card:#1d222a; --ink:#e6e8eb; --muted:#9aa4b2; --accent:#4fb89a; --line:#333b47; --err:#ff8a80; --field:#12151a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Noto Sans TC","PingFang TC",sans-serif; line-height:1.6; }
  /* 版面：頂端一列精簡設定列，下方為全寬預覽 */
  .layout { max-width:1760px; margin:0 auto; padding:12px; display:grid; gap:12px; grid-template-columns:1fr; align-items:start; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  /* 設定列：欄位小標籤 + 緊湊輸入框，空間不足時自動換行 */
  #form { padding:10px 12px; display:flex; flex-wrap:wrap; gap:8px 10px; align-items:flex-end; }
  .f { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .f label { font-size:.7rem; color:var(--muted); margin:0; line-height:1.2; font-weight:500; white-space:nowrap; }
  .f.grow { flex:1 1 220px; }
  input[type=text], input[type=password], input[type=number], select { width:100%; padding:6px 8px; height:34px; font-size:.9rem; border:1px solid var(--line); border-radius:8px; background:var(--field); color:var(--ink); }
  #code { width:104px; } #words { width:80px; } #level { width:68px; } #genre { width:108px; }
  .checks { display:flex; gap:10px; align-items:center; height:34px; }
  .checks label { display:inline-flex; align-items:center; gap:4px; font-size:.85rem; white-space:nowrap; cursor:pointer; }
  .checks input { width:16px; height:16px; margin:0; }
  #go { height:34px; min-height:0; padding:0 18px; }
  #status { flex-basis:100%; margin:0; font-size:.9rem; }
  #status:empty { display:none; }
  button { font-size:.95rem; padding:8px 16px; min-height:40px; border:0; border-radius:8px; background:var(--accent); color:#0b1a15; font-weight:600; cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.5; cursor:wait; }
  a.btn { display:inline-flex; align-items:center; font-size:.95rem; padding:8px 16px; min-height:40px; border-radius:8px; text-decoration:none; font-weight:600; }
  a.btn.secondary { color:var(--accent); border:1px solid var(--accent); }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .msg { margin-top:12px; font-size:.95rem; }
  .err { color:var(--err); } .warn { color:#f0c36d; }
  .meta { color:var(--muted); font-size:.9rem; }
  .hidden { display:none !important; }

  /* 預覽區 */
  #empty { text-align:center; color:var(--muted); padding:48px 16px; border-style:dashed; }
  #empty .big { font-size:2.2rem; }
  .doc { display:grid; gap:24px; grid-template-columns:1fr; }
  .doc h2 { margin:.1em 0; font-size:1.5rem; }
  .doc h3 { margin:1.2em 0 .4em; font-size:1.05rem; color:var(--accent); }
  .doc .text p { font-family:Georgia,"Times New Roman",serif; font-size:var(--fs,18px); line-height:1.8; margin:0 0 1em; }
  #library { padding:12px 16px; }
  #library h3 { margin:0; font-size:1rem; color:var(--accent); }
  #library .head { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; margin-bottom:8px; }
  #library .head .btns { display:flex; gap:8px; flex-wrap:wrap; }
  #library button { min-height:34px; padding:4px 12px; font-size:.85rem; }
  .libList { list-style:none; margin:0; padding:0; display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
  .libList li { background:var(--field); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .libList .t { font-weight:600; } .libList .m { color:var(--muted); font-size:.8rem; margin:2px 0 8px; }
  .libList .b { display:flex; gap:6px; flex-wrap:wrap; }
  .danger { color:var(--err) !important; border-color:var(--err) !important; }
  .share { width:100%; margin-top:8px; font-size:.8rem; }
  #preview .actions { border-top:1px solid var(--line); padding-top:16px; }

  /* 電腦／平板 */
  @media (min-width:640px) { .layout { padding:16px; } #preview { padding:20px; } }
  /* 工作區：左 = 預覽，右 = 單字表（即使沒有單字也保留這個區塊） */
  .work { display:grid; gap:12px; grid-template-columns:1fr; align-items:start; }
  #vocabPanel h3 { margin:0 0 8px; font-size:1rem; color:var(--accent); }
  .hint { font-size:.72rem; font-weight:400; color:var(--muted); margin-left:6px; }
  .addrow { display:flex; gap:6px; margin-bottom:8px; }
  .addrow input { height:34px; } .addrow button { min-height:34px; padding:0 14px; }
  #vmsg { font-size:.8rem; color:var(--muted); min-height:1.2em; margin-bottom:6px; }
  #vocabList { list-style:none; margin:0; padding:0; }
  #vocabList li { background:var(--field); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:8px; line-height:1.5; }
  #vocabList li.empty { background:none; border-style:dashed; color:var(--muted); }
  #vocabList li.on { border-color:var(--accent); } #vocabList li.fail { color:#f0c36d; cursor:pointer; }
  .kk { color:var(--muted); font-size:.9em; margin-left:.3em; }
  .lem { color:var(--muted); font-size:.85em; margin-left:.3em; }
  .def { margin-top:2px; } .zhl { color:#f0c36d; }
  #vocabList li > b { color:#7cc7ff; font-size:1.12em; letter-spacing:.2px; }  /* 單字：醒目的天藍色 */
  .def .pos { color:var(--accent); font-style:normal; font-weight:600; margin-right:2px; }
  .fsbar { display:flex; align-items:center; justify-content:flex-end; gap:6px; margin:-4px 0 8px; }
  .fsbar button { min-height:32px; padding:0 12px; font-size:.9rem; }
  .fsbar .meta { margin-right:4px; }
  /* 字體按鈕與標題同一列（按鈕靠右、與標題垂直置中）；手機只留 A−／A+ */
  #preview { position:relative; }
  .fsbar { position:absolute; top:16px; right:16px; margin:0; z-index:1; }
  .doc .text h2 { min-height:32px; display:flex; align-items:center; margin:0 0 .3em; padding-right:110px; }
  @media (min-width:640px) {
    .fsbar { top:20px; right:20px; }
    .doc .text h2 { padding-right:230px; }
  }
  @media (max-width:639px) { .fsbar .meta { display:none; } }
  .spk { min-height:0; padding:0 6px; margin-left:4px; font-size:.95rem; line-height:1.6; background:transparent; border:1px solid var(--line); color:var(--accent); border-radius:6px; }
  .del { float:right; min-height:0; padding:0 4px; background:none; border:0; color:var(--muted); font-size:1.1rem; line-height:1; }
  .del:hover { color:var(--err); }
  @media (min-width:1100px) {
    .work { grid-template-columns:minmax(0,1fr) 360px; }
    #vocabPanel { position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto; }
  }
  /* 題目區：在按鈕下方，寬螢幕時兩欄並排 */
  .qa { display:grid; gap:12px; grid-template-columns:1fr; margin-top:16px; }
  .qa:empty { display:none; }
  .qa section { background:var(--field); border:1px solid var(--line); border-radius:10px; padding:4px 16px 12px; }
  .qa h3 { margin:.9em 0 .4em; font-size:1.05rem; color:var(--accent); }
  .qa ol { margin:0; padding-left:1.3em; } .qa li { margin-bottom:.5em; }
  @media (min-width:900px) { .qa { grid-template-columns:1fr 1fr; align-items:start; } }
  /* 手機：欄位兩兩並排、按鈕滿版 */
  @media (max-width:639px) {
    .f { flex:1 1 40%; } .f.grow { flex-basis:100%; }
    #code, #words, #level, #genre { width:100%; }
    .checks { flex:1 1 100%; justify-content:space-between; }
    #go { flex:1 1 100%; height:40px; }
    .actions button { flex:1 1 40%; }
  }

  @media print {
    #form, #library, #empty, #openReader, .fsbar, #vocabPanel .addrow, #vmsg, .del, .actions, .share, #status, #linkMsg { display:none !important; }
    body { background:#fff; color:#000; } .layout { display:block; padding:0; }
    .card, .qa section { border:0; background:#fff; color:#000; } .meta { color:#444; } .qa h3 { color:#000; } .qa { display:block; }
  }
</style>
</head>
<body>
<div class="layout">
  <form id="form" class="card">
    <div class="f"><label for="code">Access code</label><input type="password" id="code" autocomplete="off" required></div>
    <div class="f grow"><label for="topic">Topic (max 100 chars)</label><input type="text" id="topic" maxlength="100" placeholder="e.g. the history of coffee" required></div>
    <div class="f"><label for="words">Words 100–2000</label><input type="number" id="words" min="100" max="2000" value="300" required></div>
    <div class="f"><label for="level">CEFR</label>
      <select id="level"><option>A1</option><option>A2</option><option selected>B1</option><option>B2</option><option>C1</option></select></div>
    <div class="f"><label for="genre">Genre (optional)</label>
      <select id="genre"><option value="">Any</option><option value="explanation">Explanation</option><option value="story">Story</option><option value="news">News style</option></select></div>
    <div class="checks">
      <label><input type="checkbox" id="questions" checked>Comprehension</label>
      <label><input type="checkbox" id="discussion" checked>Discussion</label>
    </div>
    <button type="submit" id="go">Generate</button>
    <button type="button" id="libBtn" class="secondary" style="height:34px;min-height:0;padding:0 12px">📚 Library (0)</button>
    <div id="status" class="msg" role="status"></div>
  </form>

  <section id="library" class="card hidden">
    <div class="head">
      <h3>📚 Library (saved in this browser)</h3>
      <div class="btns">
        <button type="button" id="libExport" class="secondary">Export backup</button>
        <button type="button" id="libImport" class="secondary">Import backup</button>
        <input type="file" id="libFile" accept="application/json,.json" class="hidden">
      </div>
    </div>
    <ul id="libList" class="libList"></ul>
  </section>

  <div class="work">
    <div>
    <div id="empty" class="card"><div class="big">📖</div>Set your options and press “Generate”. The preview will appear here.</div>
    <section id="preview" class="card hidden">
      <div class="fsbar"><span class="meta">Text size</span><button type="button" id="fsDec" class="secondary" aria-label="Smaller text">A−</button><span id="fsVal" class="meta">18px</span><button type="button" id="fsInc" class="secondary" aria-label="Larger text">A+</button></div>
      <div id="doc" class="doc"></div>
      <div class="actions">
        <button type="button" id="regen" class="secondary">Regenerate</button>
        <button type="button" id="save" class="secondary">💾 Save article</button>
        <button type="button" id="mkLink">Create share link</button>
        <button type="button" id="copy" class="secondary hidden">Copy link</button>
        <a id="openReader" class="btn secondary hidden" href="#" target="_blank" rel="noopener">Open reader view ↗</a>
        <button type="button" id="print" class="secondary">Print</button>
      </div>
      <input type="text" id="link" class="share hidden" readonly>
      <div id="linkMsg" class="msg meta"></div>
      <div id="qa" class="qa"></div>
    </section>
    </div>
    <aside id="vocabPanel" class="card">
      <h3>Vocabulary<span class="hint">double-click a word in the article</span></h3>
      <form id="addForm" class="addrow"><input type="text" id="addInput" maxlength="40" placeholder="Or type / paste a word" autocomplete="off"><button type="submit" class="secondary">Add</button></form>
      <div id="vmsg" role="status"></div>
      <ul id="vocabList"></ul>
    </aside>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let current = null; // 目前預覽的文章

// ---- 單字表（主持人挑選；會跟著文章存進文章庫、帶進分享連結） ----
let items = [];
// 詞性：縮寫 → 全名，顯示成 (verb)、(noun)…
const POS_FULL = { n: 'noun', v: 'verb', vt: 'verb', vi: 'verb', adj: 'adjective', adv: 'adverb', prep: 'preposition', conj: 'conjunction', pron: 'pronoun', det: 'determiner', interj: 'interjection', int: 'interjection', art: 'article', num: 'numeral' };
const posLabel = (p) => { const k = String(p || '').trim().toLowerCase().replace(/\.$/, ''); return k ? `(${POS_FULL[k] || k})` : ''; };
const canSpeak = 'speechSynthesis' in window;
const spkBtn = (w) => canSpeak ? `<button type="button" class="spk" data-say="${esc(w)}" aria-label="Play pronunciation of ${esc(w)}" title="Play pronunciation">🔊</button>` : '';
function speak(text) {
  if (!canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.85;
  const v = speechSynthesis.getVoices().find((x) => /^en[-_]US/i.test(x.lang)); if (v) u.voice = v;
  speechSynthesis.speak(u);
}
const clean = (raw) => raw.toLowerCase().replace(/[’‘]/g, "'").replace(/^[^a-z]+|[^a-z]+$/g, '').replace(/\s+/g, ' ');
function stems(w) { // 可能的原形（markets → market…）
  const out = [w];
  for (const [suf, add] of [['ies', 'y'], ['es', ''], ['s', ''], ['ed', ''], ['ed', 'e'], ['ing', ''], ['ing', 'e'], ['ly', '']]) if (w.length > suf.length + 2 && w.endsWith(suf)) out.push(w.slice(0, -suf.length) + add);
  return out;
}
const findItem = (w) => items.find((v) => stems(w).includes(v.word.toLowerCase()));
function renderVocab() {
  $('vocabList').innerHTML = items.length ? items.map((v) => {
    const k = esc(v.word.toLowerCase());
    const detail = v.loading ? '<div class="def">Looking up…</div>'
      : v.failed ? `<div class="def">${esc(v.err || 'Lookup failed')} — click to retry</div>`
      : `<div class="def">${v.pos ? `<span class="pos">${esc(posLabel(v.pos))}</span> ` : ''}${esc(v.definition || '(no definition)')}</div>${v.zh ? `<div class="zhl">${esc(v.zh)}</div>` : ''}`;
    return `<li data-w="${k}" class="${v.failed ? 'fail' : ''}"><button type="button" class="del" data-del="${k}" aria-label="Remove ${esc(v.word)}" title="Remove">×</button>` +
      `<b>${esc(v.word)}</b>${v.kk ? `<span class="kk">${esc(v.kk)}</span>` : ''}${spkBtn(v.word)}${v.lemma ? `<span class="lem">← ${esc(v.lemma)}</span>` : ''}${detail}</li>`;
  }).join('') : '<li class="empty">No words yet. Double-click a word in the article, or type one above.</li>';
}
// ---- 文章字體大小（即時生效，記在這個瀏覽器）----
let fs = 18;
try { fs = Number(localStorage.getItem('rc-fs-host')) || 18; } catch {}
function setFs(n) {
  fs = Math.min(36, Math.max(12, n));
  document.documentElement.style.setProperty('--fs', fs + 'px'); $('fsVal').textContent = fs + 'px';
  try { localStorage.setItem('rc-fs-host', fs); } catch {}
}
$('fsInc').onclick = () => setFs(fs + 2);
$('fsDec').onclick = () => setFs(fs - 2);
setFs(fs);

// 找出文章中含該字的句子，當作查詢的上下文（讓 AI 依語境給出正確意思）
function sentenceOf(text, word) {
  const re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  return ((text || '').match(/[^.!?\n]+[.!?]*/g) || []).find((x) => re.test(x))?.trim().slice(0, 300) || '';
}
async function fillWord(v) { // 呼叫後端 /api/define（Groq）：詞性、KK 音標、英文解釋、中文翻譯
  v.loading = true; v.failed = false; renderVocab();
  try {
    const r = await fetch('/api/define', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ word: v.word, context: v.ctx || '' }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `Lookup failed (${r.status})`);
    Object.assign(v, { pos: j.pos || '', kk: j.kk || '', definition: j.definition || '', zh: j.zh || '', lemma: j.lemma && j.lemma.toLowerCase() !== v.word.toLowerCase() ? j.lemma : '', err: '' });
  } catch (e) { v.failed = true; v.err = e.message; }
  v.loading = false;
  renderVocab();
}
function addWord(raw) {
  const w = clean(raw);
  if (w.length < 2 || w.length > 40) { $('vmsg').textContent = 'Please select a single word.'; return; }
  const exist = findItem(w);
  if (exist) { $('vmsg').textContent = `“${exist.word}” is already in the list.`; flash(exist); return; }
  const v = { word: w, pos: '', definition: '', zh: '', kk: '', lemma: '', ctx: sentenceOf(current?.body, w) };
  items.push(v); $('vmsg').textContent = `Added “${w}”.`;
  renderVocab(); flash(v); fillWord(v);
}
function flash(v) {
  const li = [...document.querySelectorAll('#vocabList li')].find((x) => x.dataset.w === v.word.toLowerCase()); if (!li) return;
  li.classList.add('on'); li.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); setTimeout(() => li.classList.remove('on'), 1800);
}
// 在文章上雙擊（瀏覽器會自動選取該字）→ 加入；也可手動輸入/貼上
$('doc').addEventListener('dblclick', () => { const t = getSelection().toString().trim(); if (t) addWord(t); });
$('addForm').addEventListener('submit', (e) => { e.preventDefault(); const i = $('addInput'); if (i.value.trim()) addWord(i.value); i.value = ''; });
$('vocabList').addEventListener('click', (e) => {
  const sp = e.target.closest('.spk'); if (sp) return speak(sp.dataset.say);
  const del = e.target.closest('.del'); if (del) { items = items.filter((v) => v.word.toLowerCase() !== del.dataset.del); renderVocab(); return; }
  const li = e.target.closest('li.fail'); if (li) { const v = items.find((x) => x.word.toLowerCase() === li.dataset.w); if (v) fillWord(v); }
});
renderVocab();

// ---- 記住設定：存在這台裝置的瀏覽器（localStorage），下次開啟自動帶入 ----
const SAVED = ['code', 'topic', 'words', 'level', 'genre', 'questions', 'discussion'];
function saveSettings() {
  try {
    const o = {};
    SAVED.forEach((id) => { const el = $(id); o[id] = el.type === 'checkbox' ? el.checked : el.value; });
    localStorage.setItem('rc-settings', JSON.stringify(o));
  } catch { /* 無痕模式或被封鎖時略過，不影響使用 */ }
}
function loadSettings() {
  try {
    const o = JSON.parse(localStorage.getItem('rc-settings') || '{}');
    SAVED.forEach((id) => { if (id in o) { const el = $(id); if (el.type === 'checkbox') el.checked = !!o[id]; else el.value = o[id]; } });
  } catch { /* 忽略 */ }
}
loadSettings();
$('form').addEventListener('input', saveSettings);
$('form').addEventListener('change', saveSettings);

// ---- 分享連結編碼：JSON → UTF-8 → deflate-raw 壓縮 → base64url，放在網址 hash ----
const b64url = (bytes) => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function encodeShare(obj) {
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if (typeof CompressionStream === 'undefined') return 'b.' + b64url(raw); // 不支援壓縮時退回純 base64
  const stream = new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  return 'z.' + b64url(new Uint8Array(await new Response(stream).arrayBuffer()));
}

// 讀取 SSE 串流：progress / result / error
async function generate(payload, onProgress) {
  const res = await fetch('/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  if (!res.ok) { // 驗證階段的錯誤是一般 JSON
    const j = await res.json().catch(() => ({}));
    throw new Error(j.error || `Request failed (${res.status})`);
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '', result = null;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const block = buf.slice(0, i); buf = buf.slice(i + 2);
      const ev = /event: (\w+)/.exec(block)?.[1];
      const data = JSON.parse(/data: (.*)/.exec(block)?.[1] || '{}');
      if (ev === 'progress') onProgress(data.chars);
      else if (ev === 'error') throw new Error(data.error);
      else if (ev === 'result') result = data;
    }
  }
  if (!result) throw new Error('Connection lost before the article was complete. Please retry.');
  return result;
}

function render(a, vocab = []) {
  items = vocab.map((v) => ({ ...v })); renderVocab(); $('vmsg').textContent = '';
  const mins = Math.max(1, Math.round(a.wordCount / 200));
  const ol = (title, arr) => arr.length ? `<section><h3>${title}</h3><ol>${arr.map((x) => `<li>${esc(x)}</li>`).join('')}</ol></section>` : '';
  $('doc').innerHTML =
    `<div class="text"><h2>${esc(a.title)}</h2>` +
    `<div class="meta">Level ${a.level} ・ ${a.wordCount} words (target ${a.targetWords}) ・ ~${mins} min read</div>` +
    (a.withinTolerance ? '' : `<div class="msg warn">⚠ The word count is more than 10% off the target. Press “Regenerate” to try again.</div>`) +
    `<div style="margin-top:1em">${a.body.split(/\n\s*\n/).map((p) => `<p>${esc(p)}</p>`).join('')}</div></div>`;
  $('qa').innerHTML = ol('Comprehension questions', a.questions) + ol('Discussion questions', a.discussion); // 在按鈕下方
  $('empty').classList.add('hidden');
  $('preview').classList.remove('hidden');
  $('link').classList.add('hidden'); $('copy').classList.add('hidden'); $('openReader').classList.add('hidden'); $('linkMsg').textContent = '';
}

async function run() {
  const payload = {
    code: $('code').value, topic: $('topic').value, words: Number($('words').value), level: $('level').value,
    genre: $('genre').value, questions: $('questions').checked, discussion: $('discussion').checked,
  };
  $('go').disabled = $('regen').disabled = true;
  $('status').className = 'msg'; $('status').textContent = '⏳ Generating…';
  try {
    current = await generate(payload, (n) => { $('status').textContent = `⏳ Generating… (${n} characters received)`; });
    $('status').textContent = '';
    render(current);
    if (matchMedia('(max-width:1099px)').matches) $('preview').scrollIntoView({ behavior: 'smooth' }); // 窄螢幕才需要捲動
  } catch (e) {
    $('status').className = 'msg err'; $('status').textContent = '❌ ' + e.message;
    if (e.message === 'Incorrect access code') { $('code').value = ''; saveSettings(); $('code').focus(); } // 存的是錯誤的碼就清掉
  } finally { $('go').disabled = $('regen').disabled = false; }
}

$('form').addEventListener('submit', (e) => { e.preventDefault(); run(); });
$('regen').addEventListener('click', run);
$('print').addEventListener('click', () => window.print());

// 把文章壓成分享連結（整篇文章都在網址裡，連結本身即可永久開啟）
async function buildLink(a, vocab = []) {
  const hv = vocab.filter((x) => !x.loading && !x.failed).map((x) => [x.word, x.definition, x.zh, x.kk || '', x.pos || '', x.lemma || '']); // 主持人挑的單字
  const data = await encodeShare({ v: 1, t: a.title, l: a.level, w: a.wordCount, b: a.body, q: a.questions, d: a.discussion, ...(hv.length ? { hv } : {}) });
  return new URL('read.html', location.href).href + '#' + data;
}
$('mkLink').addEventListener('click', async () => {
  if (!current) return;
  const url = await buildLink(current, items);
  $('link').value = url; $('link').classList.remove('hidden'); $('copy').classList.remove('hidden');
  $('openReader').href = url; $('openReader').classList.remove('hidden');
  $('linkMsg').textContent = `Link length: ${url.length} characters` + (url.length > 8000 ? ' (long — some messaging apps may truncate it, so test it first)' : '') + '. The link contains the whole article, so keep it and it will open forever.';
});

// ---- 文章庫：保存在本機瀏覽器（localStorage），可匯出/匯入備份 ----
const LIB_KEY = 'rc-library';
const libLoad = () => { try { const l = JSON.parse(localStorage.getItem(LIB_KEY) || '[]'); return Array.isArray(l) ? l : []; } catch { return []; } };
const libStore = (l) => { try { localStorage.setItem(LIB_KEY, JSON.stringify(l)); return true; } catch { return false; } };
const validArticle = (a) => a && typeof a.title === 'string' && typeof a.body === 'string';

function renderLib() {
  const l = libLoad();
  $('libBtn').textContent = `📚 Library (${l.length})`;
  $('libList').innerHTML = l.length ? l.map((it) => {
    const a = it.article;
    return `<li data-id="${esc(it.id)}"><div class="t">${esc(a.title)}</div>` +
      `<div class="m">Level ${esc(a.level || '')} ・ ${a.wordCount || ''} words ・ saved ${new Date(it.savedAt).toLocaleDateString()}</div>` +
      `<div class="b"><button type="button" data-act="open">Open</button><button type="button" class="secondary" data-act="copy">Copy link</button><button type="button" class="secondary danger" data-act="del">Delete</button></div></li>`;
  }).join('') : '<li style="grid-column:1/-1;color:var(--muted)">No saved articles yet. Generate one and press “💾 Save article”.</li>';
}
$('libBtn').addEventListener('click', () => $('library').classList.toggle('hidden'));

$('save').addEventListener('click', () => {
  if (!current) return;
  const l = libLoad();
  const dup = l.find((it) => it.article.body === current.body && it.article.title === current.title);
  const vocab = items.filter((v) => !v.loading && !v.failed).map(({ word, pos, definition, zh, kk, lemma }) => ({ word, pos, definition, zh, kk, lemma }));
  if (dup) { dup.vocab = vocab; $('linkMsg').textContent = libStore(l) ? '✅ Library entry updated (including your vocabulary)' : '❌ Could not save'; renderLib(); return; }
  l.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), savedAt: Date.now(), article: current, vocab });
  $('linkMsg').textContent = libStore(l) ? '✅ Saved to your library (stored in this browser only — export a backup now and then)' : '❌ Could not save: browser storage is full or blocked. Use “Create share link” instead.';
  renderLib();
});

$('libList').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]'); if (!btn) return;
  const id = btn.closest('li').dataset.id;
  const l = libLoad(); const it = l.find((x) => x.id === id); if (!it) return;
  if (btn.dataset.act === 'open') {
    current = it.article; render(current, it.vocab || []);
    $('preview').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else if (btn.dataset.act === 'copy') {
    const url = await buildLink(it.article, it.vocab || []);
    try { await navigator.clipboard.writeText(url); btn.textContent = 'Copied ✓'; } catch { prompt('Copy the link manually', url); }
    setTimeout(() => { btn.textContent = 'Copy link'; }, 1500);
  } else if (btn.dataset.act === 'del') {
    if (!confirm(`Delete “${it.article.title}”? Links you already shared are not affected.`)) return;
    libStore(l.filter((x) => x.id !== id)); renderLib();
  }
});

$('libExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({ app: 'reading-club', version: 1, items: libLoad() }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `reading-club-library-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('libImport').addEventListener('click', () => $('libFile').click());
$('libFile').addEventListener('change', async () => {
  const f = $('libFile').files[0]; $('libFile').value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    const incoming = (Array.isArray(j) ? j : j.items || []).filter((it) => validArticle(it?.article));
    const l = libLoad(); let n = 0;
    incoming.forEach((it) => {
      if (l.some((x) => x.id === it.id || (x.article.body === it.article.body && x.article.title === it.article.title))) return;
      l.push({ id: String(it.id || Date.now() + Math.random()), savedAt: Number(it.savedAt) || Date.now(), article: it.article, vocab: Array.isArray(it.vocab) ? it.vocab : [] }); n++;
    });
    l.sort((a, b) => b.savedAt - a.savedAt);
    alert(libStore(l) ? `Imported ${n} article(s)` : 'Import failed: browser storage is full');
  } catch { alert('Import failed: not a valid backup file'); }
  renderLib();
});
renderLib();

$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('link').value); $('linkMsg').textContent = '✅ Link copied'; }
  catch { $('link').select(); $('linkMsg').textContent = 'Please copy the link above manually'; }
});
</script>
</body>
