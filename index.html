<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading Club Article Generator</title>
<style>
  :root { color-scheme:dark; --bg:#14171c; --card:#1d222a; --ink:#e6e8eb; --muted:#9aa4b2; --accent:#4fb89a; --line:#333b47; --err:#ff8a80; --field:#12151a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Noto Sans TC","PingFang TC",sans-serif; line-height:1.6; }
  /* 版面：頂端一列精簡設定列，下方為全寬預覽 */
  .layout { max-width:1760px; margin:0 auto; padding:12px; display:grid; gap:12px; grid-template-columns:1fr; align-items:start; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  /* 設定列：欄位小標籤 + 緊湊輸入框，空間不足時自動換行 */
  #form { padding:10px 12px; display:flex; flex-wrap:wrap; gap:8px 10px; align-items:flex-end; }
  .f { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .f label { font-size:.7rem; color:var(--muted); margin:0; line-height:1.2; font-weight:500; white-space:nowrap; }
  .f.grow { flex:1 1 220px; }
  input[type=text], input[type=password], input[type=number], select { width:100%; padding:6px 8px; height:34px; font-size:.9rem; border:1px solid var(--line); border-radius:8px; background:var(--field); color:var(--ink); }
  #code { width:104px; } #words { width:80px; } #level { width:68px; } #genre { width:108px; }
  .checks { display:flex; gap:10px; align-items:center; height:34px; }
  .checks label { display:inline-flex; align-items:center; gap:4px; font-size:.85rem; white-space:nowrap; cursor:pointer; }
  .checks input { width:16px; height:16px; margin:0; }
  #go { height:34px; min-height:0; padding:0 18px; }
  #status { flex-basis:100%; margin:0; font-size:.9rem; }
  #status:empty { display:none; }
  button { font-size:.95rem; padding:8px 16px; min-height:40px; border:0; border-radius:8px; background:var(--accent); color:#0b1a15; font-weight:600; cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.5; cursor:wait; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .msg { margin-top:12px; font-size:.95rem; }
  .err { color:var(--err); } .warn { color:#f0c36d; }
  .meta { color:var(--muted); font-size:.9rem; }
  .hidden { display:none !important; }

  /* 預覽區 */
  #empty { text-align:center; color:var(--muted); padding:48px 16px; border-style:dashed; }
  #empty .big { font-size:2.2rem; }
  .doc { display:grid; gap:24px; grid-template-columns:1fr; }
  .doc h2 { margin:.1em 0; font-size:1.5rem; }
  .doc h3 { margin:1.2em 0 .4em; font-size:1.05rem; color:var(--accent); }
  .doc .text p { font-family:Georgia,"Times New Roman",serif; font-size:1.1rem; line-height:1.8; margin:0 0 1em; }
  .extras ul, .extras ol { padding-left:1.3em; margin:0; }
  .extras li { margin-bottom:.5em; }
  .kk { color:var(--muted); font-size:.9em; margin-left:.3em; }
  .spk { min-height:0; padding:0 6px; margin-left:4px; font-size:.95rem; line-height:1.6; background:transparent; border:1px solid var(--line); color:var(--accent); border-radius:6px; vertical-align:baseline; }
  .spk:hover { border-color:var(--accent); }
  .extras section { background:var(--field); border:1px solid var(--line); border-radius:10px; padding:4px 16px 12px; margin-bottom:12px; }
  .share { width:100%; margin-top:8px; font-size:.8rem; }
  #preview .actions { border-top:1px solid var(--line); padding-top:16px; }

  /* 電腦／平板 */
  @media (min-width:640px) { .layout { padding:16px; } #preview { padding:20px; } }
  /* 寬螢幕：文章與單字/題目並排 */
  @media (min-width:1100px) {
    .doc.has-extras { grid-template-columns:minmax(0,1fr) 400px; }
    .extras { position:sticky; top:12px; align-self:start; max-height:calc(100vh - 24px); overflow:auto; }
  }
  /* 平板（中等寬度）：單字與題目分欄排在文章下方 */
  @media (min-width:640px) and (max-width:1099px) {
    .extras { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; align-items:start; }
    .extras section { margin:0; }
  }
  /* 手機：欄位兩兩並排、按鈕滿版 */
  @media (max-width:639px) {
    .f { flex:1 1 40%; } .f.grow { flex-basis:100%; }
    #code, #words, #level, #genre { width:100%; }
    .checks { flex:1 1 100%; justify-content:space-between; }
    #go { flex:1 1 100%; height:40px; }
    .actions button { flex:1 1 40%; }
  }

  @media print {
    #form, #empty, .actions, .share, #status, #linkMsg { display:none !important; }
    body { background:#fff; color:#000; } .layout { display:block; padding:0; }
    .card, .extras section { border:0; background:#fff; color:#000; } .meta { color:#444; } .doc { display:block; } .doc h3 { color:#000; }
  }
</style>
</head>
<body>
<div class="layout">
  <form id="form" class="card">
    <div class="f"><label for="code">存取碼</label><input type="password" id="code" autocomplete="off" required></div>
    <div class="f grow"><label for="topic">主題（最多 100 字）</label><input type="text" id="topic" maxlength="100" placeholder="例如：the history of coffee" required></div>
    <div class="f"><label for="words">字數 100–2000</label><input type="number" id="words" min="100" max="2000" value="300" required></div>
    <div class="f"><label for="level">CEFR</label>
      <select id="level"><option>A1</option><option>A2</option><option selected>B1</option><option>B2</option><option>C1</option></select></div>
    <div class="f"><label for="genre">文體（選填）</label>
      <select id="genre"><option value="">不指定</option><option value="explanation">說明文</option><option value="story">故事</option><option value="news">新聞風格</option></select></div>
    <div class="checks">
      <label><input type="checkbox" id="vocab" checked>單字表</label>
      <label><input type="checkbox" id="questions" checked>理解題</label>
      <label><input type="checkbox" id="discussion" checked>討論題</label>
    </div>
    <button type="submit" id="go">產生文章</button>
    <div id="status" class="msg" role="status"></div>
  </form>

  <div>
    <div id="empty" class="card"><div class="big">📖</div>設定好條件後按「產生文章」，預覽會顯示在這裡。</div>
    <section id="preview" class="card hidden">
      <div id="doc" class="doc"></div>
      <div class="actions">
        <button type="button" id="regen" class="secondary">重新產生</button>
        <button type="button" id="mkLink">產生分享連結</button>
        <button type="button" id="copy" class="secondary hidden">複製連結</button>
        <button type="button" id="print" class="secondary">列印</button>
      </div>
      <input type="text" id="link" class="share hidden" readonly>
      <div id="linkMsg" class="msg meta"></div>
    </section>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let current = null; // 目前預覽的文章

// ---- 記住設定：存在這台裝置的瀏覽器（localStorage），下次開啟自動帶入 ----
const SAVED = ['code', 'topic', 'words', 'level', 'genre', 'vocab', 'questions', 'discussion'];
function saveSettings() {
  try {
    const o = {};
    SAVED.forEach((id) => { const el = $(id); o[id] = el.type === 'checkbox' ? el.checked : el.value; });
    localStorage.setItem('rc-settings', JSON.stringify(o));
  } catch { /* 無痕模式或被封鎖時略過，不影響使用 */ }
}
function loadSettings() {
  try {
    const o = JSON.parse(localStorage.getItem('rc-settings') || '{}');
    SAVED.forEach((id) => { if (id in o) { const el = $(id); if (el.type === 'checkbox') el.checked = !!o[id]; else el.value = o[id]; } });
  } catch { /* 忽略 */ }
}
loadSettings();
$('form').addEventListener('input', saveSettings);
$('form').addEventListener('change', saveSettings);

// ---- 發音：瀏覽器內建語音合成（免費、不需 API） ----
const canSpeak = 'speechSynthesis' in window;
function speak(text) {
  if (!canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.85;
  const v = speechSynthesis.getVoices().find((x) => /^en[-_]US/i.test(x.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
document.addEventListener('click', (e) => { const b = e.target.closest('.spk'); if (b) speak(b.dataset.say); });

// ---- 分享連結編碼：JSON → UTF-8 → deflate-raw 壓縮 → base64url，放在網址 hash ----
const b64url = (bytes) => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function encodeShare(obj) {
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if (typeof CompressionStream === 'undefined') return 'b.' + b64url(raw); // 不支援壓縮時退回純 base64
  const stream = new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  return 'z.' + b64url(new Uint8Array(await new Response(stream).arrayBuffer()));
}

// 讀取 SSE 串流：progress / result / error
async function generate(payload, onProgress) {
  const res = await fetch('/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  if (!res.ok) { // 驗證階段的錯誤是一般 JSON
    const j = await res.json().catch(() => ({}));
    throw new Error(j.error || `請求失敗（${res.status}）`);
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '', result = null;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const block = buf.slice(0, i); buf = buf.slice(i + 2);
      const ev = /event: (\w+)/.exec(block)?.[1];
      const data = JSON.parse(/data: (.*)/.exec(block)?.[1] || '{}');
      if (ev === 'progress') onProgress(data.chars);
      else if (ev === 'error') throw new Error(data.error);
      else if (ev === 'result') result = data;
    }
  }
  if (!result) throw new Error('連線中斷，未收到完整文章，請重試');
  return result;
}

function render(a) {
  const mins = Math.max(1, Math.round(a.wordCount / 200));
  const ol = (title, arr) => arr.length ? `<section><h3>${title}</h3><ol>${arr.map((x) => `<li>${esc(x)}</li>`).join('')}</ol></section>` : '';
  const vocab = a.vocabulary.length ? `<section><h3>單字表</h3><ul>${a.vocabulary.map((v) => `<li><b>${esc(v.word)}</b>${v.kk ? `<span class="kk">${esc(v.kk)}</span>` : ''}${canSpeak ? `<button type="button" class="spk" data-say="${esc(v.word)}" aria-label="播放 ${esc(v.word)} 發音" title="播放發音">🔊</button>` : ''} — ${esc(v.definition)}（${esc(v.zh)}）</li>`).join('')}</ul></section>` : '';
  const extras = vocab + ol('理解題', a.questions) + ol('討論題', a.discussion);
  const doc = $('doc');
  doc.classList.toggle('has-extras', !!extras);
  doc.innerHTML =
    `<div class="text"><h2>${esc(a.title)}</h2>` +
    `<div class="meta">程度 ${a.level} ・ 實際字數 ${a.wordCount}（目標 ${a.targetWords}）・ 預估閱讀 ${mins} 分鐘</div>` +
    (a.withinTolerance ? '' : `<div class="msg warn">⚠ 實際字數與目標相差超過 10%，可按「重新產生」再試一次。</div>`) +
    `<div style="margin-top:1em">${a.body.split(/\n\s*\n/).map((p) => `<p>${esc(p)}</p>`).join('')}</div></div>` +
    (extras ? `<aside class="extras">${extras}</aside>` : '');
  $('empty').classList.add('hidden');
  $('preview').classList.remove('hidden');
  $('link').classList.add('hidden'); $('copy').classList.add('hidden'); $('linkMsg').textContent = '';
}

async function run() {
  const payload = {
    code: $('code').value, topic: $('topic').value, words: Number($('words').value), level: $('level').value,
    genre: $('genre').value, vocab: $('vocab').checked, questions: $('questions').checked, discussion: $('discussion').checked,
  };
  $('go').disabled = $('regen').disabled = true;
  $('status').className = 'msg'; $('status').textContent = '⏳ AI 產生中…';
  try {
    current = await generate(payload, (n) => { $('status').textContent = `⏳ AI 產生中…（已收到 ${n} 字元）`; });
    $('status').textContent = '';
    render(current);
    if (matchMedia('(max-width:1099px)').matches) $('preview').scrollIntoView({ behavior: 'smooth' }); // 窄螢幕才需要捲動
  } catch (e) {
    $('status').className = 'msg err'; $('status').textContent = '❌ ' + e.message;
    if (e.message === '存取碼錯誤') { $('code').value = ''; saveSettings(); $('code').focus(); } // 存的是錯誤的碼就清掉
  } finally { $('go').disabled = $('regen').disabled = false; }
}

$('form').addEventListener('submit', (e) => { e.preventDefault(); run(); });
$('regen').addEventListener('click', run);
$('print').addEventListener('click', () => window.print());

$('mkLink').addEventListener('click', async () => {
  if (!current) return;
  const a = current; // 只放閱讀頁需要的欄位
  const data = await encodeShare({ v: 1, t: a.title, l: a.level, w: a.wordCount, b: a.body, vo: a.vocabulary.map((x) => [x.word, x.definition, x.zh, x.kk || '']), q: a.questions, d: a.discussion });
  const url = new URL('read.html', location.href).href + '#' + data;
  $('link').value = url; $('link').classList.remove('hidden'); $('copy').classList.remove('hidden');
  $('linkMsg').textContent = `連結長度 ${url.length} 字元` + (url.length > 8000 ? '（較長，部分通訊軟體可能截斷，請先自行測試）' : '');
});
$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('link').value); $('linkMsg').textContent = '✅ 已複製連結'; }
  catch { $('link').select(); $('linkMsg').textContent = '請手動複製上方連結'; }
});
</script>
</body>
</html>
