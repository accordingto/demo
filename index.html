<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>讀書會文章產生器</title>
<style>
  :root { color-scheme:dark; --bg:#14171c; --card:#1d222a; --ink:#e6e8eb; --muted:#9aa4b2; --accent:#4fb89a; --line:#333b47; --err:#ff8a80; --field:#12151a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Noto Sans TC","PingFang TC",sans-serif; line-height:1.6; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-weight:600; margin:12px 0 4px; font-size:.95rem; }
  input[type=text], input[type=password], input[type=number], select { width:100%; padding:10px; font-size:1rem; border:1px solid var(--line); border-radius:8px; background:var(--field); color:var(--ink); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .checks label { display:inline-flex; align-items:center; gap:6px; font-weight:400; margin:8px 16px 0 0; }
  button { font-size:1rem; padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#0b1a15; font-weight:600; cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.5; cursor:wait; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .msg { margin-top:12px; font-size:.95rem; }
  .err { color:var(--err); } .warn { color:#f0c36d; }
  .meta { color:var(--muted); font-size:.9rem; }
  article h2 { margin:.2em 0; }
  article p { font-family:Georgia,serif; font-size:1.05rem; }
  .share { width:100%; margin-top:8px; font-size:.8rem; }
  .hidden { display:none; }
  @media print { form, .actions, .share, #status { display:none !important; } body { background:#fff; color:#000; } .card { border:0; background:#fff; color:#000; } .meta { color:#444; } }
  @media (max-width:520px) { .row { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <form id="form" class="card">
    <label for="code">存取碼</label>
    <input type="password" id="code" autocomplete="off" required>

    <label for="topic">主題（最多 100 字）</label>
    <input type="text" id="topic" maxlength="100" placeholder="例如：the history of coffee" required>

    <div class="row">
      <div>
        <label for="words">字數（100–2000）</label>
        <input type="number" id="words" min="100" max="2000" value="300" required>
      </div>
      <div>
        <label for="level">CEFR 程度</label>
        <select id="level">
          <option>A1</option><option>A2</option><option selected>B1</option><option>B2</option><option>C1</option>
        </select>
      </div>
    </div>

    <label for="genre">文體（選填）</label>
    <select id="genre">
      <option value="">不指定</option>
      <option value="explanation">說明文</option>
      <option value="story">故事</option>
      <option value="news">新聞風格</option>
    </select>

    <div class="checks">
      <label><input type="checkbox" id="vocab" checked> 附單字表</label>
      <label><input type="checkbox" id="questions" checked> 附理解題</label>
      <label><input type="checkbox" id="discussion" checked> 附討論題</label>
    </div>

    <div class="actions"><button type="submit" id="go">產生文章</button></div>
    <div id="status" class="msg" role="status"></div>
  </form>

  <section id="preview" class="card hidden">
    <article id="article"></article>
    <div class="actions">
      <button type="button" id="regen" class="secondary">重新產生</button>
      <button type="button" id="mkLink">產生分享連結</button>
      <button type="button" id="copy" class="secondary hidden">複製連結</button>
      <button type="button" id="print" class="secondary">列印</button>
    </div>
    <input type="text" id="link" class="share hidden" readonly>
    <div id="linkMsg" class="msg"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let current = null; // 目前預覽的文章

// ---- 分享連結編碼：JSON → UTF-8 → deflate-raw 壓縮 → base64url，放在網址 hash ----
const b64url = (bytes) => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function encodeShare(obj) {
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if (typeof CompressionStream === 'undefined') return 'b.' + b64url(raw); // 不支援壓縮時退回純 base64
  const stream = new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  return 'z.' + b64url(new Uint8Array(await new Response(stream).arrayBuffer()));
}

// 讀取 SSE 串流：progress / result / error
async function generate(payload, onProgress) {
  const res = await fetch('/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  if (!res.ok) { // 驗證階段的錯誤是一般 JSON
    const j = await res.json().catch(() => ({}));
    throw new Error(j.error || `請求失敗（${res.status}）`);
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '', result = null;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const block = buf.slice(0, i); buf = buf.slice(i + 2);
      const ev = /event: (\w+)/.exec(block)?.[1];
      const data = JSON.parse(/data: (.*)/.exec(block)?.[1] || '{}');
      if (ev === 'progress') onProgress(data.chars);
      else if (ev === 'error') throw new Error(data.error);
      else if (ev === 'result') result = data;
    }
  }
  if (!result) throw new Error('連線中斷，未收到完整文章，請重試');
  return result;
}

function render(a) {
  const mins = Math.max(1, Math.round(a.wordCount / 200));
  const list = (title, arr, ordered) => arr.length ? `<h3>${title}</h3><${ordered ? 'ol' : 'ul'}>${arr.map((x) => `<li>${esc(x)}</li>`).join('')}</${ordered ? 'ol' : 'ul'}>` : '';
  $('article').innerHTML =
    `<h2>${esc(a.title)}</h2>` +
    `<div class="meta">程度 ${a.level} ・ 實際字數 ${a.wordCount}（目標 ${a.targetWords}）・ 預估閱讀 ${mins} 分鐘</div>` +
    (a.withinTolerance ? '' : `<div class="msg warn">⚠ 實際字數與目標相差超過 10%，可按「重新產生」再試一次。</div>`) +
    a.body.split(/\n\s*\n/).map((p) => `<p>${esc(p)}</p>`).join('') +
    (a.vocabulary.length ? `<h3>單字表</h3><ul>${a.vocabulary.map((v) => `<li><b>${esc(v.word)}</b> — ${esc(v.definition)}（${esc(v.zh)}）</li>`).join('')}</ul>` : '') +
    list('理解題', a.questions, true) + list('討論題', a.discussion, true);
  $('preview').classList.remove('hidden');
  $('link').classList.add('hidden'); $('copy').classList.add('hidden'); $('linkMsg').textContent = '';
}

async function run() {
  const payload = {
    code: $('code').value, topic: $('topic').value, words: Number($('words').value), level: $('level').value,
    genre: $('genre').value, vocab: $('vocab').checked, questions: $('questions').checked, discussion: $('discussion').checked,
  };
  $('go').disabled = $('regen').disabled = true;
  $('status').className = 'msg'; $('status').textContent = '⏳ AI 產生中…';
  try {
    current = await generate(payload, (n) => { $('status').textContent = `⏳ AI 產生中…（已收到 ${n} 字元）`; });
    $('status').textContent = '';
    render(current);
    $('preview').scrollIntoView({ behavior: 'smooth' });
  } catch (e) {
    $('status').className = 'msg err'; $('status').textContent = '❌ ' + e.message;
  } finally { $('go').disabled = $('regen').disabled = false; }
}

$('form').addEventListener('submit', (e) => { e.preventDefault(); run(); });
$('regen').addEventListener('click', run);
$('print').addEventListener('click', () => window.print());

$('mkLink').addEventListener('click', async () => {
  if (!current) return;
  const a = current; // 只放閱讀頁需要的欄位
  const data = await encodeShare({ v: 1, t: a.title, l: a.level, w: a.wordCount, b: a.body, vo: a.vocabulary.map((x) => [x.word, x.definition, x.zh]), q: a.questions, d: a.discussion });
  const url = new URL('read.html', location.href).href + '#' + data;
  $('link').value = url; $('link').classList.remove('hidden'); $('copy').classList.remove('hidden');
  $('linkMsg').textContent = `連結長度 ${url.length} 字元` + (url.length > 8000 ? '（較長，部分通訊軟體可能截斷，請先自行測試）' : '');
});
$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('link').value); $('linkMsg').textContent = '✅ 已複製連結'; }
  catch { $('link').select(); $('linkMsg').textContent = '請手動複製上方連結'; }
});
</script>
</body>
</html>
