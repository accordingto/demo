<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Reading</title>
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/settings.css">
<script src="js/prefs.js"></script>
<script src="js/i18n-zh.js"></script>
<script src="js/i18n.js"></script>
</head>
<body>
<!-- 版面與功能和主持人頁相同（共用 css/shared.css、js/util.js、js/vocab.js）：左＝文章（含題目），右＝單字表 -->
<header class="rtop"><span class="logo" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2zM22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/></svg></span><span class="brand-name">Reading Club</span><span class="langseg rlang" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="zh" aria-pressed="false">中文</button></span></header>
<div class="layout">
  <div class="work">
    <div>
      <section id="preview" class="card">
        <div class="fsbar"><button type="button" class="secondary iconbtn readall" aria-label="Read the whole article aloud" title="Read the whole article aloud"></button><button type="button" class="secondary iconbtn gear" aria-label="Reading settings" aria-haspopup="dialog" aria-expanded="false" title="Reading settings"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div>
        <div id="doc" class="doc"></div>
        <div id="qa" class="qa"></div>
      </section>
    </div>
    <aside id="vocabPanel" class="card">
      <h3>Vocabulary<span class="hint">double-click a word in the article</span></h3>
      <div id="vmsg" role="status"></div>
      <ul id="vocabList"></ul>
    </aside>
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/tts.js"></script>
<script src="js/vocab.js"></script>
<script src="js/settings.js"></script>
<script src="js/readaloud.js"></script>
<script src="js/reader.js"></script>
</body>
</html>
