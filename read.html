<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Reading</title>
<style>
  :root { color-scheme:dark; --bg:#14171c; --ink:#e3e5e8; --muted:#9aa4b2; --accent:#4fb89a; --line:#333b47; --card:#1d222a; --fs:20px; }
  * { box-sizing: border-box; }
  body { touch-action:manipulation; margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Noto Sans TC",sans-serif; }
  button { font-family:inherit; }

  /* 版面：手機/平板 = 上方工具列 + 文章 + 下方單字題目；電腦 = 左工具欄 / 中文章 / 右單字題目 */
  .layout { max-width:1700px; margin:0 auto; display:block; }
  .bar { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); padding:8px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; z-index:2; }
  .bar button { font-size:.95rem; padding:8px 14px; min-height:40px; border:1px solid var(--accent); background:transparent; color:var(--accent); border-radius:8px; cursor:pointer; }
  .bar .info { color:var(--muted); font-size:.85rem; margin-left:auto; }
  .bar .group { display:flex; gap:8px; flex-wrap:wrap; }
  main { padding:16px 16px 24px; max-width:760px; margin:0 auto; }
  h1 { font-family:Georgia,serif; font-size:1.7rem; line-height:1.25; margin:16px 0 4px; }
  .meta { color:var(--muted); font-size:.9rem; margin-bottom:16px; }
  #body p { font-family:Georgia,"Times New Roman",serif; font-size:var(--fs); line-height:1.75; margin:0 0 1em; }
  .w { cursor:pointer; border-radius:3px; } .w.hit { border-bottom:2px dotted var(--accent); } .w:hover { background:#27424a; }

  aside.side { padding:0 16px 96px; display:grid; gap:12px; align-content:start; }
  aside.side section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:4px 16px 12px; }
  aside.side h3 { margin:.9em 0 .4em; font-size:1.05rem; color:var(--accent); }
  aside.side ul, aside.side ol { margin:0; padding-left:1.3em; }
  li { margin-bottom:.5em; line-height:1.6; }
  .kk { color:var(--muted); font-size:.9em; margin-left:.3em; }
  .spk { padding:0 6px; margin-left:4px; font-size:.95rem; line-height:1.6; background:transparent; border:1px solid var(--line); color:var(--accent); border-radius:6px; cursor:pointer; }
  .spk:hover { border-color:var(--accent); }
  .hint { font-size:.7rem; font-weight:400; color:var(--muted); margin-left:6px; }
  .del { float:right; border:0; background:none; color:var(--muted); cursor:pointer; font-size:1.1rem; line-height:1; padding:0 4px; }
  .del:hover { color:#ff8a80; }
  .user b::after { content:' ＋'; color:var(--accent); font-weight:400; font-size:.8em; }
  #vocabList li { cursor:pointer; } #vocabList li.on { background:#27424a; border-radius:4px; }

  #pop { position:fixed; left:12px; right:12px; bottom:12px; max-width:560px; margin:0 auto; background:var(--card); border:1px solid var(--accent); border-radius:12px; padding:12px 16px; box-shadow:0 4px 16px rgba(0,0,0,.5); display:none; z-index:3; }
  #pop.show { display:block; } #pop b { font-size:1.1rem; } #pop .x { float:right; border:0; background:none; color:var(--ink); font-size:1.3rem; cursor:pointer; padding:0 4px; }
  .err { padding:32px 16px; text-align:center; color:#ff8a80; }

  /* 平板：單字表與題目並排 */
  @media (min-width:700px) {
    main { padding:24px 32px; }
    aside.side { padding:0 32px 96px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); max-width:1100px; margin:0 auto; }
  }
  /* 電腦：三欄 */
  @media (min-width:1100px) {
    .layout { display:grid; grid-template-columns:240px minmax(0,1fr) 380px; gap:32px; align-items:start; padding:0 24px; }
    .bar { position:sticky; top:0; align-self:start; flex-direction:column; align-items:stretch; border:0; padding:24px 0; height:100vh; overflow:auto; }
    .bar button { text-align:left; }
    .bar .group { flex-direction:column; }
    .bar .info { margin:16px 0 0; }
    main { padding:24px 0; max-width:none; width:100%; }
    #body, main > h1, main > .meta { max-width:780px; margin-left:auto; margin-right:auto; }
    aside.side { display:block; padding:24px 0; position:sticky; top:0; max-height:100vh; overflow:auto; max-width:none; margin:0; }
    aside.side section { margin-bottom:12px; }
  }
  @media print {
    .bar, #pop { display:none !important; } body { background:#fff; color:#000; } .layout { display:block; }
    aside.side section { background:#fff; border:0; } aside.side h3 { color:#000; } .meta { color:#444; }
  }
</style>
</head>
<body>
<div class="layout">
  <div class="bar" id="bar" hidden>
    <div class="group">
      <button id="dec" aria-label="縮小字體">A−</button>
      <button id="inc" aria-label="放大字體">A+</button>
    </div>
    <div class="group">
      <button id="tq">理解題：顯示</button>
      <button id="td">討論題：顯示</button>
    </div>
    <div class="info" id="info"></div>
  </div>
  <main id="main"></main>
  <aside class="side" id="side"></aside>
</div>
<div id="pop" role="dialog"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---- 解碼：base64url →（inflate-raw 解壓）→ UTF-8 → JSON ----
async function decodeShare(hash) {
  const [kind, b64] = [hash.slice(0, 2), hash.slice(2)];
  const bin = atob(b64.replace(/-/g, '+').replace(/_/g, '/'));
  let bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  if (kind === 'z.') {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    bytes = new Uint8Array(await new Response(stream).arrayBuffer());
  } else if (kind !== 'b.') throw new Error('bad');
  return JSON.parse(new TextDecoder().decode(bytes));
}

let vocab = new Map(); // 小寫單字 → { word, definition, zh, kk }

// ---- 發音：瀏覽器內建語音合成（免費、不需 API） ----
const canSpeak = 'speechSynthesis' in window;
const spkBtn = (w) => canSpeak ? `<button type="button" class="spk" data-say="${esc(w)}" aria-label="播放 ${esc(w)} 發音" title="播放發音">🔊</button>` : '';
function speak(text) {
  if (!canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.85;
  const v = speechSynthesis.getVoices().find((x) => /^en[-_]US/i.test(x.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

// 找單字：完全相同，或去掉常見字尾後相同（例如 markets → market）
function lookup(raw) {
  const w = raw.toLowerCase().replace(/^[^a-z]+|[^a-z]+$/g, '');
  if (vocab.has(w)) return vocab.get(w);
  for (const suf of ['s', 'es', 'ed', 'd', 'ing', 'ly']) {
    if (w.endsWith(suf) && vocab.has(w.slice(0, -suf.length))) return vocab.get(w.slice(0, -suf.length));
  }
  return null;
}

let items = []; // 單字表項目：文章附帶的 + 使用者雙擊加入的（user:true）
const hashKey = 'rc-user-' + [...location.hash].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7); // 以連結內容區分文章

function renderVocab() {
  const ul = $('vocabList'); if (!ul) return;
  ul.innerHTML = items.length ? items.map((v) =>
    `<li data-w="${esc(v.word.toLowerCase())}" class="${v.user ? 'user' : ''}">` +
    (v.user ? `<button type="button" class="del" data-del="${esc(v.word.toLowerCase())}" aria-label="移除 ${esc(v.word)}" title="移除">×</button>` : '') +
    `<b>${esc(v.word)}</b>${v.kk ? `<span class="kk">${esc(v.kk)}</span>` : ''}${spkBtn(v.word)} — ${v.loading ? '查詢中…' : `${esc(v.definition || '（查無解釋）')}${v.zh ? `（${esc(v.zh)}）` : ''}`}</li>`
  ).join('') : '<li style="list-style:none;color:var(--muted)">（尚無單字）</li>';
}
function refreshHits() { document.querySelectorAll('.w').forEach((el) => el.classList.toggle('hit', !!lookup(el.textContent))); }
function persistUser() {
  try { localStorage.setItem(hashKey, JSON.stringify(items.filter((v) => v.user).map(({ word, definition, zh, kk }) => ({ word, definition, zh, kk })))); } catch {}
}

// 向免費字典／翻譯服務查詢（失敗就留空，不影響使用）
async function fetchJson(url) { const r = await fetch(url, { signal: AbortSignal.timeout(8000) }); if (!r.ok) throw new Error(r.status); return r.json(); }
async function fillWord(v) {
  const [d, t] = await Promise.allSettled([
    fetchJson('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(v.word)),
    fetchJson('https://api.mymemory.translated.net/get?langpair=en|zh-TW&q=' + encodeURIComponent(v.word)),
  ]);
  if (d.status === 'fulfilled' && Array.isArray(d.value) && d.value[0]) {
    const e = d.value[0], m = e.meanings?.[0];
    v.kk = e.phonetic || e.phonetics?.find((x) => x.text)?.text || '';
    if (m?.definitions?.[0]) v.definition = (m.partOfSpeech ? `(${m.partOfSpeech}) ` : '') + m.definitions[0].definition;
  }
  if (t.status === 'fulfilled') {
    const z = t.value?.responseData?.translatedText;
    if (z && z.toLowerCase() !== v.word.toLowerCase()) v.zh = z;
  }
  v.loading = false;
  renderVocab(); persistUser();
  if ($('pop').classList.contains('show') && $('pop').dataset.w === v.word.toLowerCase()) popup(v, v.word);
}

// 雙擊單字 → 加入右側單字表
function addWord(raw) {
  const w = raw.toLowerCase().replace(/^[^a-z]+|[^a-z]+$/g, '');
  if (w.length < 2) return null;
  let v = lookup(w);
  if (v) return v; // 已在單字表
  v = { word: w, definition: '', zh: '', kk: '', user: true, loading: true };
  vocab.set(w, v); items.push(v);
  renderVocab(); refreshHits(); fillWord(v);
  return v;
}

function show(a) {
  a.vo.forEach(([word, definition, zh, kk]) => { const v = { word, definition, zh, kk: kk || '' }; vocab.set(word.toLowerCase(), v); items.push(v); });
  // 還原這篇文章先前自己加入的單字
  try {
    JSON.parse(localStorage.getItem(hashKey) || '[]').forEach((u) => {
      if (!u?.word || vocab.has(u.word.toLowerCase())) return;
      const v = { ...u, user: true, loading: false }; vocab.set(v.word.toLowerCase(), v); items.push(v);
      if (!v.definition && !v.zh) { v.loading = true; fillWord(v); }
    });
  } catch {}
  const words = a.b.trim().split(/\s+/).length;
  const mins = Math.max(1, Math.round(words / 200));
  // 每個單字包成 span 供點擊；單字表內的字加底線提示
  const para = (p) => `<p>${p.split(/(\s+)/).map((t) => /\S/.test(t) ? `<span class="w${lookup(t) ? ' hit' : ''}">${esc(t)}</span>` : t).join('')}</p>`;
  const list = (id, title, arr) => arr.length ? `<section id="${id}"><h3>${title}</h3><ol>${arr.map((x) => `<li>${esc(x)}</li>`).join('')}</ol></section>` : '';
  document.title = a.t;
  $('main').innerHTML =
    `<h1>${esc(a.t)}</h1><div class="meta">程度 ${esc(a.l)} ・ ${words} 字 ・ 預估閱讀 ${mins} 分鐘</div>` +
    `<div id="body">${a.b.split(/\n\s*\n/).map(para).join('')}</div>`;
  $('side').innerHTML =
    `<section><h3>單字表<span class="hint">雙擊文章中的單字可加入</span></h3><ul id="vocabList"></ul></section>` +
    list('qs', '理解題', a.q) + list('ds', '討論題', a.d);
  renderVocab();
  $('info').textContent = `程度 ${a.l} ・ ${words} 字 ・ 約 ${mins} 分鐘`;
  $('bar').hidden = false;
  if (!a.q.length) $('tq').hidden = true;
  if (!a.d.length) $('td').hidden = true;
}

// 字體大小（記在 localStorage，失敗就忽略）
let fs = 20;
try { fs = Number(localStorage.getItem('fs')) || 20; } catch {}
const setFs = (n) => { fs = Math.min(36, Math.max(14, n)); document.documentElement.style.setProperty('--fs', fs + 'px'); try { localStorage.setItem('fs', fs); } catch {} };
setFs(fs);
$('inc').onclick = () => setFs(fs + 2);
$('dec').onclick = () => setFs(fs - 2);

// 顯示/隱藏理解題、討論題
function toggle(btn, secId, label) {
  btn.onclick = () => {
    const s = $(secId); if (!s) return;
    s.hidden = !s.hidden;
    btn.textContent = `${label}：${s.hidden ? '隱藏' : '顯示'}`;
  };
}
toggle($('tq'), 'qs', '理解題'); toggle($('td'), 'ds', '討論題');

// 點擊單字顯示解釋；點單字表項目也可以顯示
function popup(v, raw) {
  const pop = $('pop');
  pop.innerHTML = v
    ? `<button class="x" aria-label="關閉">×</button><b>${esc(v.word)}</b>${v.kk ? `<span class="kk">${esc(v.kk)}</span>` : ''}${spkBtn(v.word)}<div>${v.loading ? '查詢中…' : esc(v.definition || '（查無解釋）')}</div><div>${esc(v.zh)}</div>`
    : `<button class="x" aria-label="關閉">×</button>單字表中沒有「${esc(raw.replace(/^[^\w]+|[^\w]+$/g, ''))}」`;
  pop.dataset.w = v ? v.word.toLowerCase() : '';
  pop.classList.add('show');
}
document.addEventListener('click', (e) => {
  const sp = e.target.closest('.spk');
  if (sp) return speak(sp.dataset.say); // 播放發音，不觸發單字表點擊
  if (e.target.classList.contains('x')) return $('pop').classList.remove('show');
  if (e.target.classList.contains('w')) {
    const v = lookup(e.target.textContent);
    document.querySelectorAll('#vocabList li').forEach((li) => li.classList.toggle('on', !!v && li.dataset.w === v.word.toLowerCase()));
    return popup(v, e.target.textContent);
  }
  const del = e.target.closest('.del');
  if (del) { // 移除自己加入的單字
    const k = del.dataset.del; vocab.delete(k); items = items.filter((v) => v.word.toLowerCase() !== k);
    renderVocab(); refreshHits(); persistUser(); return;
  }
  const li = e.target.closest('#vocabList li[data-w]');
  if (li) popup(vocab.get(li.dataset.w), li.dataset.w);
});

document.addEventListener('dblclick', (e) => {
  const t = e.target.closest('.w'); if (!t) return;
  getSelection()?.removeAllRanges();
  const v = addWord(t.textContent);
  if (v) popup(v, t.textContent);
});

(async () => {
  try {
    const a = await decodeShare(location.hash.slice(1));
    if (typeof a.b !== 'string' || typeof a.t !== 'string') throw new Error('bad');
    a.vo = Array.isArray(a.vo) ? a.vo : []; a.q = Array.isArray(a.q) ? a.q : []; a.d = Array.isArray(a.d) ? a.d : [];
    show(a);
  } catch {
    $('main').innerHTML = '<div class="err">找不到文章，連結可能不完整或已損壞。<br>請向主持人重新索取連結。</div>';
  }
})();
</script>
</body>
</html>
