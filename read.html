<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Reading</title>
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/settings.css">
<script src="js/prefs.js"></script>
</head>
<body>
<!-- 版面與功能和主持人頁相同（共用 css/shared.css、js/util.js、js/vocab.js）：左＝文章（含題目），右＝單字表 -->
<div class="layout">
  <div class="work">
    <div>
      <section id="preview" class="card">
        <div class="fsbar"><button type="button" class="secondary iconbtn readall" aria-label="Read the whole article aloud" title="Read the whole article aloud"></button><button type="button" class="secondary iconbtn gear" aria-label="Reading settings" aria-haspopup="dialog" aria-expanded="false" title="Reading settings">⚙</button></div>
        <div id="doc" class="doc"></div>
        <div id="qa" class="qa"></div>
      </section>
    </div>
    <aside id="vocabPanel" class="card">
      <h3>Vocabulary<span class="hint">double-click a word in the article</span></h3>
      <div id="vmsg" role="status"></div>
      <ul id="vocabList"></ul>
    </aside>
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/tts.js"></script>
<script src="js/vocab.js"></script>
<script src="js/settings.js"></script>
<script src="js/readaloud.js"></script>
<script src="js/reader.js"></script>
</body>
</html>
