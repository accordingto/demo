<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>計算機</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      background: #000;
      overflow: hidden;
      color: #fff;
    }

    /* ── Header ── */
    header {
      background: #1c1c1e;
      border-bottom: 1px solid #3a3a3c;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 17px;
      font-weight: 600;
      flex-shrink: 0;
    }

    header a.back {
      font-size: 13px;
      font-weight: 500;
      color: #ff9500;
      text-decoration: none;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(255,149,0,0.15);
      transition: background 0.15s;
    }
    header a.back:hover { background: rgba(255,149,0,0.25); }

    /* ── Main layout ── */
    .main {
      display: flex;
      height: calc(100% - 49px);
    }

    /* ══════════════════════════════
       Left panel
    ══════════════════════════════ */
    .left {
      flex: 0 0 38%;
      display: flex;
      flex-direction: column;
      background: #1c1c1e;
      border-right: 1px solid #3a3a3c;
      overflow: hidden;
    }

    /* History list */
    .history {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .history::-webkit-scrollbar { width: 4px; }
    .history::-webkit-scrollbar-thumb { background: #48484a; border-radius: 2px; }

    .history-empty {
      color: #48484a;
      font-size: 14px;
      text-align: center;
      margin: auto;
    }

    .hist-item {
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .hist-item:hover { background: #2c2c2e; }

    .hist-expr {
      font-size: 15px;
      color: #8e8e93;
      text-align: right;
      line-height: 1.4;
      word-break: break-all;
    }
    .hist-result {
      font-size: 24px;
      font-weight: 300;
      color: #e0e0e0;
      text-align: right;
    }

    /* Divider */
    .history-divider {
      height: 1px;
      background: #3a3a3c;
      margin: 0 16px;
      flex-shrink: 0;
    }

    /* Current display */
    .display {
      flex-shrink: 0;
      padding: 14px 16px 18px;
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 公式 — 放大 */
    .display .expr {
      font-size: 26px;
      color: #8e8e93;
      min-height: 36px;
      word-break: break-all;
      line-height: 1.35;
    }

    /* 當前輸入值 */
    .display .result {
      font-size: 52px;
      font-weight: 200;
      line-height: 1.1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* clear history button */
    .clear-hist {
      flex-shrink: 0;
      padding: 8px 16px;
      text-align: right;
    }
    .clear-hist button {
      font-size: 12px;
      color: #8e8e93;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .clear-hist button:hover { color: #ff453a; }
    .clear-hist button:active { filter: none; }

    /* ══════════════════════════════
       Right panel — buttons
    ══════════════════════════════ */
    .button-panel {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 1px;
      background: #3a3a3c;
      padding-bottom: max(0px, env(safe-area-inset-bottom));
    }

    button {
      border: none;
      font-size: 28px;
      font-weight: 400;
      cursor: pointer;
      color: #fff;
      background: #2c2c2e;
      transition: filter 0.1s;
      touch-action: manipulation;
    }

    button:active { filter: brightness(0.7); }

    .fn   { background: #636366; font-size: 22px; }
    .op   { background: #ff9500; font-weight: 500; }
    .op.active-op { background: #fff; color: #ff9500; }
    .eq   { background: #ff9500; font-weight: 500; }
    .zero { grid-column: span 2; }
  </style>
</head>
<body>

<header>
  <a class="back" href="index.html">&#8592; 首頁</a>
  🔢 計算機
</header>

<div class="main">

  <!-- Left: history + display -->
  <div class="left">

    <div class="clear-hist">
      <button onclick="clearHistory()">清除記錄</button>
    </div>

    <div class="history" id="history">
      <div class="history-empty" id="hist-empty">計算記錄會顯示在這裡</div>
    </div>

    <div class="history-divider"></div>

    <div class="display">
      <div class="expr"   id="expr"></div>
      <div class="result" id="result">0</div>
    </div>

  </div>

  <!-- Right: buttons -->
  <div class="button-panel">
    <button class="fn"   onclick="ac()">AC</button>
    <button class="fn"   onclick="sign()">+/-</button>
    <button class="fn"   onclick="pct()">%</button>
    <button class="op"   id="btn-/" onclick="pressOp('/')">÷</button>

    <button onclick="digit('7')">7</button>
    <button onclick="digit('8')">8</button>
    <button onclick="digit('9')">9</button>
    <button class="op"   id="btn-*" onclick="pressOp('*')">×</button>

    <button onclick="digit('4')">4</button>
    <button onclick="digit('5')">5</button>
    <button onclick="digit('6')">6</button>
    <button class="op"   id="btn--" onclick="pressOp('-')">−</button>

    <button onclick="digit('1')">1</button>
    <button onclick="digit('2')">2</button>
    <button onclick="digit('3')">3</button>
    <button class="op"   id="btn-+" onclick="pressOp('+')">+</button>

    <button class="zero" onclick="digit('0')">0</button>
    <button onclick="dot()">.</button>
    <button class="eq"   onclick="eq()">=</button>
  </div>

</div>

<script>
  const SYM    = { '+':'+', '-':'−', '*':'×', '/':'÷' };
  const COMPUTE = {
    '+': (a,b) => a+b,
    '-': (a,b) => a-b,
    '*': (a,b) => a*b,
    '/': (a,b) => b !== 0 ? a/b : NaN
  };

  let cur        = '0';   // number currently displayed / being typed
  let runningVal = null;  // accumulated result so far
  let currentOp  = null;  // pending operator
  let exprParts  = [];    // tokens for display: ["20", "+", "39", "+"]
  let reset      = false; // next digit press starts a fresh number

  const resultEl = document.getElementById('result');
  const exprEl   = document.getElementById('expr');
  const histEl   = document.getElementById('history');

  function show() {
    resultEl.textContent = cur;
    exprEl.textContent   = exprParts.join(' ');
  }

  function setActiveOp(op) {
    ['+','-','*','/'].forEach(o => {
      document.getElementById('btn-'+o).classList.toggle('active-op', o === op && reset);
    });
  }

  function digit(d) {
    if (reset) { cur = d; reset = false; }
    else cur = cur === '0' ? d : cur + d;
    setActiveOp(null);
    show();
  }

  function dot() {
    if (reset) { cur = '0.'; reset = false; }
    else if (!cur.includes('.')) cur += '.';
    setActiveOp(null);
    show();
  }

  function pressOp(o) {
    // If operator pressed twice in a row: just swap the operator
    if (reset && currentOp !== null) {
      exprParts[exprParts.length - 1] = SYM[o];
      currentOp = o;
      setActiveOp(o);
      show();
      return;
    }

    const val = parseFloat(cur);

    if (runningVal === null) {
      runningVal = val;
    } else {
      runningVal = COMPUTE[currentOp](runningVal, val);
      if (isNaN(runningVal)) { showError(); return; }
    }

    exprParts.push(cur, SYM[o]);
    currentOp = o;
    reset = true;
    setActiveOp(o);
    show();
  }

  function eq() {
    if (currentOp === null && exprParts.length === 0) return;

    const val = parseFloat(cur);
    let result;

    if (currentOp !== null) {
      result = COMPUTE[currentOp](runningVal, val);
    } else {
      result = val;
    }

    const fullExpr  = [...exprParts, cur].join(' ');
    const resultStr = isNaN(result) ? 'Error' : String(parseFloat(result.toFixed(10)));

    exprEl.textContent    = fullExpr + ' =';
    resultEl.textContent  = resultStr;
    cur = resultStr;

    addHistory(fullExpr, resultStr);

    runningVal = null;
    currentOp  = null;
    exprParts  = [];
    reset      = true;
    setActiveOp(null);
  }

  function ac() {
    cur = '0'; runningVal = null; currentOp = null; exprParts = []; reset = false;
    setActiveOp(null);
    show();
  }

  function sign() {
    if (cur === '0' || cur === 'Error') return;
    cur = String(parseFloat(cur) * -1);
    show();
  }

  function pct() {
    cur = String(parseFloat(cur) / 100);
    show();
  }

  function showError() {
    cur = 'Error'; runningVal = null; currentOp = null; exprParts = []; reset = true;
    show();
  }

  /* ── History ── */
  function addHistory(expr, result) {
    const empty = document.getElementById('hist-empty');
    if (empty) empty.remove();

    const item = document.createElement('div');
    item.className = 'hist-item';
    item.innerHTML = `<div class="hist-expr">${expr} =</div><div class="hist-result">${result}</div>`;
    item.onclick = () => { cur = result; reset = false; show(); };
    histEl.appendChild(item);
    histEl.scrollTop = histEl.scrollHeight;
  }

  function clearHistory() {
    histEl.innerHTML = '<div class="history-empty" id="hist-empty">計算記錄會顯示在這裡</div>';
  }

  /* ── Keyboard ── */
  document.addEventListener('keydown', e => {
    if (e.key >= '0' && e.key <= '9')            digit(e.key);
    else if (e.key === '.')                        dot();
    else if (e.key === '+')                        pressOp('+');
    else if (e.key === '-')                        pressOp('-');
    else if (e.key === '*')                        pressOp('*');
    else if (e.key === '/') { e.preventDefault();  pressOp('/'); }
    else if (e.key === 'Enter' || e.key === '=')   eq();
    else if (e.key === 'Escape')                   ac();
    else if (e.key === 'Backspace') {
      if (reset) return;
      cur = cur.length > 1 ? cur.slice(0, -1) : '0';
      show();
    }
  });
</script>
</body>
</html>
