<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>計算機</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      background: #f2f2f7;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e5;
      padding: 12px 20px 12px max(20px, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 17px;
      font-weight: 700;
      color: #1c1c1e;
      flex-shrink: 0;
    }

    header a.back {
      font-size: 14px;
      font-weight: 500;
      color: #007aff;
      text-decoration: none;
      padding: 5px 12px;
      border-radius: 20px;
      background: #e8f0fe;
      transition: background 0.15s;
    }

    header a.back:hover { background: #d0e4fc; }

    /* ── Main layout ── */
    .main {
      display: flex;
      height: calc(100% - 49px);
      padding: 0 max(0px, env(safe-area-inset-right)) 0 max(0px, env(safe-area-inset-left));
    }

    /* ── Display panel (left) ── */
    .display-panel {
      flex: 0 0 38%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px 28px;
      border-right: 1px solid #e0e0e5;
      background: #fff;
      gap: 8px;
    }

    .expr {
      font-size: 22px;
      color: #8e8e93;
      text-align: right;
      min-height: 32px;
      word-break: break-all;
      line-height: 1.4;
    }

    .result {
      font-size: 64px;
      font-weight: 200;
      color: #1c1c1e;
      text-align: right;
      line-height: 1.1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Button panel (right) ── */
    .button-panel {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 1px;
      background: #d1d1d6;
      padding-bottom: max(0px, env(safe-area-inset-bottom));
    }

    button {
      border: none;
      font-size: 26px;
      font-weight: 400;
      cursor: pointer;
      background: #f9f9f9;
      color: #1c1c1e;
      transition: filter 0.1s;
      touch-action: manipulation;
    }

    button:active { filter: brightness(0.88); }

    /* Function buttons: AC +/- % */
    .fn { background: #e5e5ea; color: #1c1c1e; font-size: 22px; }

    /* Operator buttons */
    .op { background: #ff9500; color: #fff; font-weight: 500; }
    .op:active { filter: brightness(0.88); }

    /* Equal button */
    .eq { background: #ff9500; color: #fff; font-weight: 500; }

    /* Zero spans 2 columns */
    .zero { grid-column: span 2; }
  </style>
</head>
<body>

<header>
  <a class="back" href="index.html">&#8592; 首頁</a>
  🔢 計算機
</header>

<div class="main">

  <!-- Left: display -->
  <div class="display-panel">
    <div class="expr"   id="expr"></div>
    <div class="result" id="result">0</div>
  </div>

  <!-- Right: buttons -->
  <div class="button-panel">
    <button class="fn" onclick="ac()">AC</button>
    <button class="fn" onclick="sign()">+/-</button>
    <button class="fn" onclick="pct()">%</button>
    <button class="op" onclick="op('/')">÷</button>

    <button onclick="digit('7')">7</button>
    <button onclick="digit('8')">8</button>
    <button onclick="digit('9')">9</button>
    <button class="op" onclick="op('*')">×</button>

    <button onclick="digit('4')">4</button>
    <button onclick="digit('5')">5</button>
    <button onclick="digit('6')">6</button>
    <button class="op" onclick="op('-')">−</button>

    <button onclick="digit('1')">1</button>
    <button onclick="digit('2')">2</button>
    <button onclick="digit('3')">3</button>
    <button class="op" onclick="op('+')">+</button>

    <button class="zero" onclick="digit('0')">0</button>
    <button onclick="dot()">.</button>
    <button class="eq" onclick="eq()">=</button>
  </div>

</div>

<script>
  let cur = '0', prev = '', oper = null, reset = false;

  const resultEl = document.getElementById('result');
  const exprEl   = document.getElementById('expr');
  const SYM = { '+':'+', '-':'−', '*':'×', '/':'÷' };

  function show() { resultEl.textContent = cur; }

  function digit(d) {
    if (reset) { cur = d; reset = false; }
    else cur = cur === '0' ? d : cur + d;
    show();
  }

  function dot() {
    if (reset) { cur = '0.'; reset = false; }
    else if (!cur.includes('.')) cur += '.';
    show();
  }

  function op(o) {
    if (oper && !reset) calc(true);
    prev = cur; oper = o; reset = true;
    exprEl.textContent = `${prev} ${SYM[o]}`;
  }

  function calc(chained = false) {
    if (!oper || !prev) return;
    const a = parseFloat(prev), b = parseFloat(cur);
    const res = oper === '+' ? a+b : oper === '-' ? a-b : oper === '*' ? a*b : b ? a/b : 'Error';
    if (!chained) {
      exprEl.textContent = `${prev} ${SYM[oper]} ${cur} =`;
      oper = null;
    }
    cur = typeof res === 'number' ? String(parseFloat(res.toFixed(10))) : res;
    reset = true;
    show();
  }

  function eq()   { calc(); }
  function ac()   { cur='0'; prev=''; oper=null; reset=false; exprEl.textContent=''; show(); }
  function sign() { cur = String(parseFloat(cur) * -1); show(); }
  function pct()  { cur = String(parseFloat(cur) / 100); show(); }

  document.addEventListener('keydown', e => {
    if (e.key >= '0' && e.key <= '9')        digit(e.key);
    else if (e.key === '.')                   dot();
    else if (e.key === '+')                   op('+');
    else if (e.key === '-')                   op('-');
    else if (e.key === '*')                   op('*');
    else if (e.key === '/') { e.preventDefault(); op('/'); }
    else if (e.key === 'Enter' || e.key === '=') eq();
    else if (e.key === 'Escape')              ac();
    else if (e.key === 'Backspace') {
      cur = cur.length > 1 ? cur.slice(0, -1) : '0';
      show();
    }
  });
</script>
</body>
</html>
